<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>10つなぎ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=RocknRoll+One&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #f5efe1;
    --bg-1: #ede4cf;
    --bg-2: #e0d4ba;
    --paper: #fdfaf2;
    --ink: #3a352e;
    --dim: #8a7f6e;
    --line: rgba(58, 53, 46, 0.12);
    --accent: #c4685a;     /* くすみ朱 */
    --accent-2: #6b9080;   /* 青磁 */
    --gold: #c19658;       /* くすみ金 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overscroll-behavior-x: none;
    touch-action: none;
    position: fixed;
    width: 100%;
  }

  body {
    background:
      radial-gradient(ellipse at top left, rgba(196, 104, 90, 0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(107, 144, 128, 0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(58,53,46,0.018) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(-45deg, rgba(58,53,46,0.018) 0 1px, transparent 1px 5px);
    pointer-events: none;
    z-index: 0;
  }

  .game-shell {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .top-bar {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 14px;
  }

  .header-right {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    justify-content: flex-end;
  }
  .stats-strip {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
    flex-wrap: wrap;
    flex: 1;
  }

  /* メニューボタン */
  .menu-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .menu-btn {
    width: 38px;
    height: 38px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    padding: 0;
    transition: all 0.12s;
  }
  .menu-btn span {
    display: block;
    width: 16px;
    height: 2px;
    background: var(--ink);
    border-radius: 1px;
    transition: all 0.2s;
  }
  .menu-btn:hover {
    background: var(--accent);
  }
  .menu-btn:hover span {
    background: var(--paper);
  }
  .menu-btn.open span:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
  }
  .menu-btn.open span:nth-child(2) {
    opacity: 0;
  }
  .menu-btn.open span:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
  }
  .menu-btn.open {
    background: var(--accent);
  }
  .menu-btn.open span {
    background: var(--paper);
  }

  .menu-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-width: 150px;
    z-index: 200;
    box-shadow: 0 6px 20px rgba(58, 53, 46, 0.18);
    overflow: hidden;
  }
  .menu-dropdown[hidden] {
    display: none;
  }
  .menu-item {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    padding: 12px 18px;
    font-family: 'DotGothic16', monospace;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    letter-spacing: 0.1em;
    transition: background 0.1s;
  }
  .menu-item + .menu-item {
    border-top: 1px solid var(--line);
  }
  .menu-item:hover {
    background: var(--bg-1);
  }
  .menu-item:active {
    background: var(--accent);
    color: var(--paper);
  }
  .menu-header {
    padding: 8px 18px;
    background: var(--bg-1);
    font-family: 'DotGothic16', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.3em;
    border-bottom: 1px solid var(--line);
  }
  .brand { line-height: 1; }
  .brand .kanji {
    font-family: 'RocknRoll One', sans-serif;
    font-size: 28px;
    color: var(--accent);
    text-shadow: 2px 2px 0 rgba(196, 104, 90, 0.15);
    letter-spacing: -1px;
  }
  .brand .latin {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.4em;
    color: var(--dim);
    margin-top: 4px;
  }

  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 5px 9px;
    border-radius: 3px;
    text-align: center;
    min-width: 58px;
  }
  .stat-label {
    font-family: 'DotGothic16', monospace;
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.2em;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 16px;
    line-height: 1.1;
    color: var(--ink);
  }
  .stat-value.score { color: var(--gold); }
  .stat-value.level { color: var(--accent); }
  .stat-value.time  { color: var(--accent-2); }
  .stat-value.combo { color: var(--accent); }
  .stat-value.time.warn {
    color: var(--accent);
    animation: pulse 0.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .timer-bar-wrap {
    height: 4px;
    background: rgba(58, 53, 46, 0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .timer-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-2), var(--gold), var(--accent));
    transition: width 0.1s linear;
  }

  .level-progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
  }
  .lv-label {
    font-weight: 800;
    color: var(--accent);
    min-width: 36px;
    letter-spacing: 0.05em;
  }
  .lv-count {
    font-weight: 700;
    color: var(--ink);
    min-width: 50px;
    text-align: right;
  }
  .level-progress-bar {
    flex: 1;
    height: 3px;
    background: rgba(58, 53, 46, 0.10);
    border-radius: 2px;
    overflow: hidden;
  }
  .level-progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease-out;
  }

  .sum-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 10px 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    transition: all 0.15s;
  }
  .sum-banner.ten {
    background: linear-gradient(180deg, rgba(193, 150, 88, 0.15), rgba(196, 104, 90, 0.10));
    border-color: var(--gold);
  }
  .sum-banner.over {
    background: rgba(196, 104, 90, 0.08);
    border-color: rgba(196, 104, 90, 0.3);
  }
  .sum-banner .label {
    font-family: 'DotGothic16', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.3em;
  }
  .sum-banner .value {
    font-family: 'RocknRoll One', sans-serif;
    font-size: 30px;
    line-height: 1;
    color: var(--ink);
    transition: color 0.15s;
  }
  .sum-banner.ten .value {
    color: var(--gold);
  }
  .sum-banner.over .value { color: var(--accent); }
  .sum-banner .target {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--accent-2);
    font-weight: 700;
  }

  .board-frame {
    position: relative;
    padding: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow:
      inset 0 0 30px rgba(58, 53, 46, 0.04),
      0 4px 20px rgba(58, 53, 46, 0.08);
  }
  .board-frame::before, .board-frame::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--accent-2);
    pointer-events: none;
    opacity: 0.6;
  }
  .board-frame::before {
    top: -1px; left: -1px;
    border-right: none; border-bottom: none;
  }
  .board-frame::after {
    bottom: -1px; right: -1px;
    border-left: none; border-top: none;
  }

  .board {
    position: relative;
    display: grid;
    gap: 4px;
    aspect-ratio: 7 / 8;
  }

  .cell {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    color: #3a352e;
    cursor: pointer;
    transition: transform 0.12s;
    box-shadow:
      inset 0 -2px 0 rgba(58, 53, 46, 0.10),
      inset 0 1px 0 rgba(255,255,255,0.5);
    will-change: transform;
  }
  .cell.empty {
    background: transparent !important;
    box-shadow: none;
    pointer-events: none;
    color: transparent;
  }
  .cell.selected {
    transform: scale(0.92);
    box-shadow:
      inset 0 -2px 0 rgba(58, 53, 46, 0.10),
      inset 0 1px 0 rgba(255,255,255,0.5),
      0 0 0 2.5px var(--accent),
      0 0 12px rgba(196, 104, 90, 0.35);
    z-index: 2;
  }
  .cell.clearing {
    animation: clear 0.4s ease-out forwards;
    pointer-events: none;
  }
  @keyframes clear {
    0% { transform: scale(1); }
    35% { transform: scale(1.15); }
    100% { transform: scale(0); opacity: 0; }
  }
  .cell.falling {
    animation: fallIn 0.3s ease-out;
  }
  @keyframes fallIn {
    0% { transform: translateY(-30px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .trail-svg {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    pointer-events: none;
    z-index: 3;
  }

  .float-score {
    position: absolute;
    pointer-events: none;
    font-family: 'RocknRoll One', sans-serif;
    font-size: 24px;
    color: var(--gold);
    text-shadow: 1px 1px 0 var(--paper);
    z-index: 5;
    animation: floatUp 1.2s ease-out forwards;
    white-space: nowrap;
    transform: translate(-50%, 0);
  }
  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    20% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
  }

  .combo-burst {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'RocknRoll One', sans-serif;
    font-size: 56px;
    color: var(--accent);
    text-shadow: 3px 3px 0 var(--paper), -1px -1px 0 var(--gold);
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    letter-spacing: -2px;
  }
  .combo-burst.show {
    animation: comboBurst 1s ease-out forwards;
  }
  @keyframes comboBurst {
    0%   { opacity: 0; transform: translate(-50%, 20px) scale(0.3) rotate(-6deg); }
    25%  { opacity: 1; transform: translate(-50%, 0) scale(1.3) rotate(2deg); }
    70%  { opacity: 1; transform: translate(-50%, -10px) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(1.2); }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(245, 239, 225, 0.82);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }
  .overlay-content {
    text-align: center;
    max-width: 380px;
    padding: 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 6px 30px rgba(58, 53, 46, 0.12);
  }
  .overlay-title {
    font-family: 'RocknRoll One', sans-serif;
    font-size: 44px;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: -2px;
  }
  .overlay-sub {
    font-family: 'DotGothic16', monospace;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.3em;
    margin-bottom: 22px;
  }
  .rules-list {
    text-align: left;
    font-family: 'DotGothic16', monospace;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.8;
    margin-bottom: 22px;
  }
  .rules-list li {
    list-style: none;
    padding-left: 20px;
    position: relative;
  }
  .rules-list li::before {
    content: '◆';
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  .overlay-stats {
    background: var(--bg-1);
    border: 1px solid var(--line);
    padding: 14px 18px;
    margin-bottom: 22px;
    text-align: left;
    border-radius: 4px;
  }
  .overlay-stats div {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px dashed var(--line);
  }
  .overlay-stats div:last-child { border-bottom: none; }
  .overlay-stats .label { color: var(--dim); font-family: 'DotGothic16', monospace; }
  .overlay-stats .value { color: var(--gold); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

  .btn {
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: 14px 36px;
    font-family: 'RocknRoll One', sans-serif;
    font-size: 18px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 3px 3px 0 var(--bg-2);
    border-radius: 3px;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--bg-2); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--bg-2); }

  /* 合計値セレクター */
  .target-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 18px;
    padding: 14px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .target-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--accent);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
  }
  .target-btn:hover { background: var(--accent); color: var(--paper); }
  .target-btn:active { transform: scale(0.92); }
  .target-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .target-current {
    text-align: center;
    min-width: 80px;
  }
  .target-num-big {
    font-family: 'RocknRoll One', sans-serif;
    font-size: 36px;
    color: var(--accent);
    line-height: 1;
  }
  .target-sub {
    font-family: 'DotGothic16', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.3em;
    margin-top: 4px;
  }

  /* ランキング */
  .ranking-section {
    margin-top: 20px;
    text-align: left;
  }
  .ranking-toggle {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--dim);
    padding: 10px;
    font-family: 'DotGothic16', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .ranking-toggle:hover {
    background: var(--bg-1);
    color: var(--ink);
  }
  .ranking-content {
    margin-top: 10px;
    padding: 12px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .ranking-header {
    font-family: 'DotGothic16', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
    text-align: center;
  }
  .ranking-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .ranking-list li {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 8px;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .ranking-list li:last-child { border-bottom: none; }
  .ranking-list .rank-num {
    font-family: 'RocknRoll One', sans-serif;
    color: var(--gold);
    font-size: 14px;
    text-align: center;
  }
  .ranking-list .rank-num.first { color: var(--accent); }
  .ranking-list .rank-score {
    color: var(--ink);
    font-weight: 700;
  }
  .ranking-list .rank-meta {
    color: var(--dim);
    font-size: 10px;
  }
  .ranking-empty {
    text-align: center;
    color: var(--dim);
    padding: 12px;
    font-family: 'DotGothic16', monospace;
    font-size: 12px;
  }
  .ranking-clear-btn {
    width: 100%;
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 6px;
    font-family: 'DotGothic16', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    cursor: pointer;
    border-radius: 3px;
  }
  .ranking-clear-btn:hover {
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
  }

  .floating-digits {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .floating-digits span {
    position: absolute;
    font-family: 'DotGothic16', monospace;
    color: rgba(58, 53, 46, 0.05);
    font-weight: 700;
    animation: drift 30s linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(110vh) rotate(0deg); }
    to   { transform: translateY(-20vh) rotate(360deg); }
  }

  @media (max-width: 460px) {
    .brand .kanji { font-size: 22px; }
    .stat { min-width: 50px; padding: 4px 7px; }
    .stat-value { font-size: 14px; }
    .sum-banner .value { font-size: 26px; }
    .overlay-title { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="floating-digits" id="floating-digits"></div>

<div class="game-shell">
  <div class="top-bar">
    <div class="brand">
      <div class="kanji">10つなぎ</div>
      <div class="latin">TEN・TSUNAGI</div>
    </div>
    <div class="header-right">
      <div class="stats-strip">
        <div class="stat">
          <div class="stat-label">SCORE</div>
          <div class="stat-value score" id="score">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">LEVEL</div>
          <div class="stat-value level" id="level">1</div>
        </div>
        <div class="stat">
          <div class="stat-label">TIME</div>
          <div class="stat-value time" id="time">60</div>
        </div>
        <div class="stat">
          <div class="stat-label">COMBO</div>
          <div class="stat-value combo" id="combo">0</div>
        </div>
      </div>
      <div class="menu-wrap" id="menu-wrap">
        <button class="menu-btn" id="menu-btn" aria-label="メニュー">
          <span></span><span></span><span></span>
        </button>
        <div class="menu-dropdown" id="menu-dropdown" hidden>
          <div class="menu-header">メニュー</div>
          <button class="menu-item" id="menu-restart">はじめから</button>
          <button class="menu-item" id="menu-ranking">ランキング</button>
        </div>
      </div>
    </div>
  </div>

  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timer-bar" style="width: 100%;"></div>
  </div>

  <div class="level-progress-wrap">
    <span class="lv-label">Lv<span id="lv-num">1</span></span>
    <div class="level-progress-bar">
      <div class="level-progress-fill" id="lv-fill" style="width: 0%"></div>
    </div>
    <span class="lv-count"><span id="lv-current">0</span>/<span id="lv-target">30</span></span>
  </div>

  <div class="sum-banner" id="sum-banner">
    <div class="label">合計</div>
    <div class="value" id="current-sum">0</div>

  <div class="board-frame">

      <div><span class="label">スコア</span><span class="value" id="final-score">0</span></div>

      <div><span class="label">最大コンボ</span><span class="value" id="final-combo">0</span></div>
      <div><span class="label">消した数</span><span class="value" id="final-cleared">0</span></div>
      <div><span class="label">最大同時消し</span><span class="value" id="final-best">0</span></div>

      <button class="btn" id="confirm-yes">はい</button>
      <button class="btn" id="confirm-no" style="background: var(--bg-2); color: var(--ink);">いいえ</button>
    </div>

<script>
'use strict';

const COLS = 7;
const ROWS = 8;

const COLORS = {
  1: '#f4b6c2',  /* 桜鼠 */
  2: '#e8a87c',  /* 杏色 */
  3: '#c9a0b8',  /* 薄藤 */
  4: '#a89cb0',  /* 紫鼠 */
  5: '#c8b6a6',  /* 薄香 */
  6: '#a3c4bc',  /* 青磁 */
  7: '#b8d4d8',  /* 水浅葱 */
  8: '#b8c9a3',  /* 若苗 */
  9: '#e6c98a',  /* 黄朽葉 */
};

const boardEl = document.getElementById('board');
const trailEl = document.getElementById('trail');

let grid = [];
let cellEls = [];
let selected = [];
let isSelecting = false;

let score = 0;
let timeLeft = 60;
let combo = 0;
let maxCombo = 0;
let totalCleared = 0;
let bestSingleClear = 0;
let comboTimer = 0;
let lastTime = 0;
let isPlaying = false;
let isPaused = false;

let level = 1;
let targetSum = 10; // 目標合計値（5〜20）

// レベル計算: Lv1→Lv2は30個、必要数は+30ずつ増加
// しきい値: Lv2開始=30, Lv3開始=90, Lv4開始=180, Lv5開始=300, Lv6開始=450
function getLevelInfo() {
  let lv = 1;
  let baseThreshold = 0;
  let step = 30;
  while (totalCleared >= baseThreshold + step && lv < 99) {
    baseThreshold += step;
    step += 30;
    lv++;
  }
  return {
    level: lv,
    progress: totalCleared - baseThreshold,
    target: step,
  };
}

// レベルとターゲット値に応じた数字分布
function rollDigitForLevel(lv, target) {
  const max = Math.min(9, target - 1);

  // ペアでtargetを作れる数字（自己ペアを除く）
  const pairs = [];
  for (let d = 1; d <= max; d++) {
    const p = target - d;
    if (p >= 1 && p <= max && p !== d) pairs.push(d);
  }
  // 自己ペア（5+5など、target=偶数のとき）
  const self = (target % 2 === 0 && target / 2 <= max) ? target / 2 : null;

  // ターゲット値を作りやすい平均値周辺を多めに（target=20で9多めなど）
  const avgPick = () => {
    const avg = Math.min(max, Math.max(1, Math.round(target / 2)));
    const r = Math.random();
    if (r < 0.4) return avg;
    if (r < 0.7) {
      const offset = Math.random() < 0.5 ? -1 : 1;
      return Math.min(max, Math.max(1, avg + offset));
    }
    return Math.floor(Math.random() * max) + 1;
  };

  if (lv === 1) {
    // 自己ペア多め + ペア候補多め（入門用）
    if (self !== null && Math.random() < 0.3) return self;
    if (pairs.length > 0 && Math.random() < 0.65) {
      return pairs[Math.floor(Math.random() * pairs.length)];
    }
    return avgPick();
  }
  if (lv === 2) {
    if (pairs.length > 0 && Math.random() < 0.55) {
      return pairs[Math.floor(Math.random() * pairs.length)];
    }
    if (self !== null && Math.random() < 0.08) return self;
    return avgPick();
  }
  if (lv <= 4) {
    if (self !== null && Math.random() < 0.08) return self;
    return Math.floor(Math.random() * max) + 1;
  }
  // Lv5+: 小さい数字に偏らせる → 3つ以上つなぐ必要が出て難しい
  if (Math.random() < 0.6) {
    const half = Math.max(1, Math.floor(max / 2));
    return Math.floor(Math.random() * half) + 1;
  }
  if (self !== null && Math.random() < 0.05) return self;
  return Math.floor(Math.random() * max) + 1;
}

// 隣接ペアで合計 targetSum になる組み合わせ数を数える（4方向のみ）
function countTenCombinations() {
  let count = 0;
  const dirs = [[1, 0], [0, 1]]; // 右と下のみ（重複避け）
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const v = grid[y][x];
      if (v == null) continue;
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        const nv = grid[ny][nx];
        if (nv == null) continue;
        if (v + nv === targetSum) count++;
      }
    }
  }
  return count;
}

// 初期盤面生成: targetSum になる隣接ペアが最低10組できるよう保証
function generateBoard(lv) {
  // ペアで作れる組み合わせがあるかチェック
  const max = Math.min(9, targetSum - 1);
  let canPair = false;
  for (let d = 1; d <= max; d++) {
    const p = targetSum - d;
    if (p >= 1 && p <= max && p !== d) { canPair = true; break; }
  }
  // 自己ペアでも作れるかチェック
  if (!canPair) {
    canPair = (targetSum % 2 === 0 && targetSum / 2 <= max);
  }
  const target = canPair ? 10 : 0; // ペアで作れない場合は保証スキップ

  const maxAttempts = 40;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    grid = [];
    for (let y = 0; y < ROWS; y++) {
      grid[y] = [];
      for (let x = 0; x < COLS; x++) {
        grid[y][x] = rollDigitForLevel(lv, targetSum);
      }
    }
    if (countTenCombinations() >= target) return;
  }

  if (target > 0) {
    let safety = 80;
    while (countTenCombinations() < target && safety-- > 0) {
      if (!addRandomPair()) break;
    }
  }
}

function addRandomPair() {
  const max = Math.min(9, targetSum - 1);
  // ペアで targetSum を作る数字（自己ペアを避ける）
  const choices = [];
  for (let d = 1; d <= max; d++) {
    const p = targetSum - d;
    if (p >= 1 && p <= max && p !== d) choices.push(d);
  }
  if (choices.length === 0) return false;

  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]]; // 4方向のみ
  for (let i = 0; i < 30; i++) {
    const x = Math.floor(Math.random() * COLS);
    const y = Math.floor(Math.random() * ROWS);
    const [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
    const v1 = choices[Math.floor(Math.random() * choices.length)];
    grid[y][x] = v1;
    grid[ny][nx] = targetSum - v1;
    return true;
  }
  return false;
}

function buildBoard() {
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
  cellEls = [];
  for (let y = 0; y < ROWS; y++) {
    cellEls[y] = [];
    for (let x = 0; x < COLS; x++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.x = x;
      el.dataset.y = y;
      boardEl.appendChild(el);
      cellEls[y][x] = el;
    }
  }
}

function fillGridFresh() {
  generateBoard(level);
  renderAll();
}

function renderAll() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const v = grid[y][x];
      const el = cellEls[y][x];
      el.classList.remove('selected', 'clearing', 'falling');
      if (v == null) {
        el.classList.add('empty');
        el.textContent = '';
        el.style.background = '';
      } else {
        el.classList.remove('empty');
        el.textContent = v;
        el.style.background = COLORS[v];
      }
    }
  }
  adjustFontSize();
}

function adjustFontSize() {
  if (!cellEls[0] || !cellEls[0][0]) return;
  const size = cellEls[0][0].offsetWidth;
  if (size === 0) return;
  const fontSize = Math.max(14, Math.floor(size * 0.5));
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      cellEls[y][x].style.fontSize = fontSize + 'px';
    }
  }
}

function getCellAtPoint(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  if (!el || !el.classList.contains('cell')) return null;
  if (el.classList.contains('empty')) return null;
  if (el.classList.contains('clearing')) return null;
  const x = parseInt(el.dataset.x, 10);
  const y = parseInt(el.dataset.y, 10);
  if (isNaN(x) || isNaN(y)) return null;
  if (grid[y][x] == null) return null;
  return { x, y };
}

function isAdjacent(a, b) {
  const dx = Math.abs(a.x - b.x);
  const dy = Math.abs(a.y - b.y);
  // 上下左右4方向のみ（斜めは禁止）
  return (dx + dy === 1);
}

function startSelect(cell) {
  if (!isPlaying) return;
  isSelecting = true;
  selected = [cell];
  updateSelectionVisual();
}

function moveSelect(cell) {
  if (!isSelecting || selected.length === 0) return;
  const last = selected[selected.length - 1];
  if (last.x === cell.x && last.y === cell.y) return;

  if (selected.length >= 2) {
    const prev = selected[selected.length - 2];
    if (prev.x === cell.x && prev.y === cell.y) {
      selected.pop();
      updateSelectionVisual();
      return;
    }
  }

  if (selected.some(s => s.x === cell.x && s.y === cell.y)) return;
  if (!isAdjacent(last, cell)) return;

  const currentSum = sumOf(selected);
  if (currentSum + grid[cell.y][cell.x] > targetSum) return;

  selected.push(cell);
  updateSelectionVisual();
}

function endSelect() {
  if (!isSelecting) return;
  isSelecting = false;

  const sum = sumOf(selected);
  if (sum === targetSum && selected.length >= 2) {
    clearSelected();
  } else {
    selected = [];
    updateSelectionVisual();
  }
}

function sumOf(cells) {
  let s = 0;
  for (const c of cells) {
    const v = grid[c.y][c.x];
    if (v != null) s += v;
  }
  return s;
}

function updateSelectionVisual() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      cellEls[y][x].classList.remove('selected');
    }
  }
  for (const s of selected) {
    cellEls[s.y][s.x].classList.add('selected');
  }
  const sum = sumOf(selected);
  const sumBanner = document.getElementById('sum-banner');
  document.getElementById('current-sum').textContent = sum;
  sumBanner.classList.toggle('ten', sum === targetSum && selected.length >= 2);
  sumBanner.classList.toggle('over', sum > targetSum);

  drawTrail();
}

function drawTrail() {
  trailEl.innerHTML = '';
  if (selected.length < 2) return;
  const boardRect = boardEl.getBoundingClientRect();
  const points = selected.map(s => {
    const rect = cellEls[s.y][s.x].getBoundingClientRect();
    return {
      x: rect.left - boardRect.left + rect.width / 2,
      y: rect.top - boardRect.top + rect.height / 2,
    };
  });
  const sum = sumOf(selected);
  const color = sum === targetSum ? '#c19658' : (sum > targetSum ? '#c4685a' : '#6b9080');

  const w = boardEl.offsetWidth;
  const h = boardEl.offsetHeight;
  trailEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
  trailEl.setAttribute('width', w);
  trailEl.setAttribute('height', h);

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  path.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', '5');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  path.setAttribute('opacity', '0.75');
  trailEl.appendChild(path);
}

function clearSelected() {
  const cleared = selected.slice();
  const count = cleared.length;

  const base = 100;
  const bonus = count * (count - 1);
  const comboMul = 1 + combo * 0.2;
  const gained = Math.floor(base * count * (1 + bonus / 5) * comboMul);
  score += gained;

  totalCleared += count;
  if (count > bestSingleClear) bestSingleClear = count;
  combo += 1;
  if (combo > maxCombo) maxCombo = combo;
  comboTimer = 4000;

  const timeBonus = count >= 5 ? 4 : (count >= 4 ? 3 : (count >= 3 ? 2 : 1));
  timeLeft = Math.min(99, timeLeft + timeBonus);

  if (cleared.length > 0) {
    const last = cleared[cleared.length - 1];
    const rect = cellEls[last.y][last.x].getBoundingClientRect();
    const boardRect = boardEl.getBoundingClientRect();
    const fs = document.createElement('div');
    fs.className = 'float-score';
    fs.textContent = `+${gained}`;
    fs.style.left = (rect.left - boardRect.left + rect.width / 2) + 'px';
    fs.style.top = (rect.top - boardRect.top) + 'px';
    boardEl.appendChild(fs);
    setTimeout(() => fs.remove(), 1200);
  }

  if (combo >= 2) {
    const burst = document.getElementById('combo-burst');
    burst.textContent = `${combo}・連続`;
    burst.classList.remove('show');
    void burst.offsetWidth;
    burst.classList.add('show');
  }

  for (const c of cleared) {
    cellEls[c.y][c.x].classList.add('clearing');
  }

  selected = [];
  updateSelectionVisual();

  setTimeout(() => {
    for (const c of cleared) {
      grid[c.y][c.x] = null;
    }
    applyGravityAndRefill();

    // レベルアップ判定（盤面はそのまま）
    const info = getLevelInfo();
    if (info.level > level) {
      setTimeout(() => triggerLevelUp(info.level), 300);
    }
  }, 380);

  updateUI();
}

function triggerLevelUp(newLv) {
  level = newLv;
  timeLeft = Math.min(99, timeLeft + 5);
  score += 500;

  const burst = document.getElementById('combo-burst');
  burst.textContent = `LEVEL ${level}`;
  burst.classList.remove('show');
  void burst.offsetWidth;
  burst.classList.add('show');

  // 盤面はリセットしない。補充される数字の傾向だけ変わる。
  updateUI();
}

function applyGravityAndRefill() {
  const newCells = []; // 新しく上から補充されたセルだけアニメ対象
  for (let x = 0; x < COLS; x++) {
    let writeY = ROWS - 1;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y][x] != null) {
        if (writeY !== y) {
          grid[writeY][x] = grid[y][x];
          grid[y][x] = null;
        }
        writeY--;
      }
    }
    for (let y = writeY; y >= 0; y--) {
      grid[y][x] = rollDigitForLevel(level, targetSum);
      newCells.push({ x, y });
    }
  }
  renderAll();
  // 既存セルは触らず、新規補充セルだけ落下アニメ
  for (const { x, y } of newCells) {
    cellEls[y][x].classList.add('falling');
  }
}

function updateUI() {
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('level').textContent = level;
  document.getElementById('time').textContent = Math.ceil(timeLeft);
  document.getElementById('combo').textContent = combo;
  const bar = document.getElementById('timer-bar');
  bar.style.width = Math.max(0, Math.min(100, timeLeft / 60 * 100)) + '%';
  document.getElementById('time').classList.toggle('warn', timeLeft <= 10);

  // レベル進捗バー
  const info = getLevelInfo();
  document.getElementById('lv-num').textContent = info.level;
  document.getElementById('lv-current').textContent = info.progress;
  document.getElementById('lv-target').textContent = info.target;
  document.getElementById('lv-fill').style.width =
    Math.min(100, info.progress / info.target * 100) + '%';
}

function loop(t) {
  if (lastTime === 0) lastTime = t;
  const dt = Math.min(100, t - lastTime);
  lastTime = t;

  if (isPlaying && !isPaused) {
    timeLeft -= dt / 1000;
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }
    updateUI();
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver();
    }
  }
  requestAnimationFrame(loop);
}

function startGame() {
  score = 0;
  timeLeft = 60;
  combo = 0;
  maxCombo = 0;
  totalCleared = 0;
  bestSingleClear = 0;
  comboTimer = 0;
  selected = [];
  level = 1;
  isPlaying = true;
  fillGridFresh();
  setTimeout(adjustFontSize, 50);
  updateUI();
  document.getElementById('start-overlay').classList.remove('active');
  document.getElementById('gameover-overlay').classList.remove('active');
}

function gameOver() {
  isPlaying = false;
  selected = [];
  updateSelectionVisual();

  // ランキングに保存
  if (score > 0) {
    saveScoreToRanking(targetSum, {
      score: score,
      level: level,
      combo: maxCombo,
      cleared: totalCleared,
      date: new Date().toISOString(),
    });
  }

  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('final-level').textContent = level;
  document.getElementById('final-combo').textContent = maxCombo;
  document.getElementById('final-cleared').textContent = totalCleared;
  document.getElementById('final-best').textContent = bestSingleClear;
  document.getElementById('gameover-overlay').classList.add('active');
}

function onPointerDown(e) {
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  const cell = getCellAtPoint(pt.clientX, pt.clientY);
  if (cell) startSelect(cell);
}
function onPointerMove(e) {
  if (!isSelecting) return;
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  const cell = getCellAtPoint(pt.clientX, pt.clientY);
  if (cell) moveSelect(cell);
}
function onPointerUp(e) {
  if (!isSelecting) return;
  if (e && e.preventDefault) e.preventDefault();
  endSelect();
}

boardEl.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
boardEl.addEventListener('touchstart', onPointerDown, { passive: false });
window.addEventListener('touchmove', onPointerMove, { passive: false });
window.addEventListener('touchend', onPointerUp, { passive: false });
window.addEventListener('touchcancel', onPointerUp);

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', () => {
  // リトライ時はスタート画面に戻す（合計値選択&ランキング確認のため）
  document.getElementById('gameover-overlay').classList.remove('active');
  document.getElementById('start-overlay').classList.add('active');
  // ランキングが開いていれば再描画
  const content = document.getElementById('ranking-content');
  if (content && !content.hidden) renderRanking();
});

window.addEventListener('resize', () => {
  adjustFontSize();
  if (selected.length > 1) drawTrail();
});

// =====================================================
// ランキング機能（localStorage）
// =====================================================
const RANKING_KEY = 'tsunagi_rankings_v1';

function loadRankings() {
  try {
    const data = localStorage.getItem(RANKING_KEY);
    return data ? JSON.parse(data) : {};
  } catch (e) {
    return {};
  }
}

function saveScoreToRanking(target, entry) {
  try {
    const all = loadRankings();
    const key = String(target);
    if (!all[key]) all[key] = [];
    all[key].push(entry);
    all[key].sort((a, b) => b.score - a.score);
    all[key] = all[key].slice(0, 10);
    localStorage.setItem(RANKING_KEY, JSON.stringify(all));
  } catch (e) {}
}

function clearRanking(target) {
  try {
    const all = loadRankings();
    delete all[String(target)];
    localStorage.setItem(RANKING_KEY, JSON.stringify(all));
  } catch (e) {}
}

function formatDate(d) {
  const dt = new Date(d);
  const m = dt.getMonth() + 1;
  const day = dt.getDate();
  return `${m}/${day}`;
}

function renderRanking() {
  const content = document.getElementById('ranking-content');
  if (!content || content.hidden) return;
  const all = loadRankings();
  const list = all[String(targetSum)] || [];

  let html = `<div class="ranking-header">合計 ${targetSum} の上位記録</div>`;
  if (list.length === 0) {
    html += '<div class="ranking-empty">まだ記録がありません</div>';
  } else {
    html += '<ol class="ranking-list">';
    list.forEach((entry, i) => {
      const rankClass = i === 0 ? 'first' : '';
      html += `<li>
        <span class="rank-num ${rankClass}">${i + 1}</span>
        <span class="rank-score">${entry.score.toLocaleString()}点</span>
        <span class="rank-meta">Lv${entry.level} ・ ${formatDate(entry.date)}</span>
      </li>`;
    });
    html += '</ol>';
    html += `<button class="ranking-clear-btn" id="ranking-clear">この記録を消去</button>`;
  }
  content.innerHTML = html;

  const clearBtn = document.getElementById('ranking-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      if (confirm(`合計${targetSum}のランキングを消去しますか？`)) {
        clearRanking(targetSum);
        renderRanking();
      }
    });
  }
}

// =====================================================
// 目標合計値の変更
// =====================================================
function setTargetSum(v) {
  targetSum = Math.max(5, Math.min(20, v));
  document.getElementById('target-display-big').textContent = targetSum;
  document.getElementById('target-display').textContent = targetSum;
  // ボタンの有効/無効
  document.getElementById('target-down').disabled = (targetSum <= 5);
  document.getElementById('target-up').disabled = (targetSum >= 20);
  renderRanking();
}

document.getElementById('target-down').addEventListener('click', () => setTargetSum(targetSum - 1));
document.getElementById('target-up').addEventListener('click', () => setTargetSum(targetSum + 1));

// =====================================================
// ランキングトグル
// =====================================================
document.getElementById('ranking-toggle').addEventListener('click', () => {
  const content = document.getElementById('ranking-content');
  const toggle = document.getElementById('ranking-toggle');
  if (content.hidden) {
    content.hidden = false;
    toggle.textContent = '▲ ランキングを閉じる';
    renderRanking();
  } else {
    content.hidden = true;
    toggle.textContent = '▼ ランキングを見る';
  }
});

// 初期化
setTargetSum(10);

// =====================================================
// メニュー
// =====================================================
function openMenu() {
  document.getElementById('menu-dropdown').hidden = false;
  document.getElementById('menu-btn').classList.add('open');
  if (isPlaying) isPaused = true;
}

function closeMenu() {
  document.getElementById('menu-dropdown').hidden = true;
  document.getElementById('menu-btn').classList.remove('open');
  // ランキングモーダルや確認モーダルが開いてないなら再開
  const rankingOpen = document.getElementById('pause-overlay').classList.contains('active');
  const confirmOpen = document.getElementById('confirm-overlay').classList.contains('active');
  if (isPlaying && !rankingOpen && !confirmOpen) {
    isPaused = false;
  }
}

function toggleMenu() {
  const isOpen = !document.getElementById('menu-dropdown').hidden;
  if (isOpen) closeMenu();
  else openMenu();
}

document.getElementById('menu-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleMenu();
});

document.getElementById('menu-dropdown').addEventListener('click', (e) => {
  e.stopPropagation();
});

document.addEventListener('click', () => {
  if (!document.getElementById('menu-dropdown').hidden) closeMenu();
});

// 「はじめから」: 確認ダイアログを出す
document.getElementById('menu-restart').addEventListener('click', () => {
  closeMenu();
  if (isPlaying) {
    document.getElementById('confirm-overlay').classList.add('active');
    isPaused = true;
  } else {
    // ゲーム中でなければ即スタート画面へ
    document.getElementById('start-overlay').classList.add('active');
  }
});

document.getElementById('confirm-yes').addEventListener('click', () => {
  document.getElementById('confirm-overlay').classList.remove('active');
  isPlaying = false;
  isPaused = false;
  selected = [];
  document.getElementById('start-overlay').classList.add('active');
});

document.getElementById('confirm-no').addEventListener('click', () => {
  document.getElementById('confirm-overlay').classList.remove('active');
  if (isPlaying) isPaused = false;
});

// 「ランキング」
document.getElementById('menu-ranking').addEventListener('click', () => {
  closeMenu();
  renderRankingModal();
  document.getElementById('pause-overlay').classList.add('active');
  if (isPlaying) isPaused = true;
});

document.getElementById('ranking-close-btn').addEventListener('click', () => {
  document.getElementById('pause-overlay').classList.remove('active');
  if (isPlaying) isPaused = false;
});

function renderRankingModal() {
  const content = document.getElementById('ranking-modal-content');
  const all = loadRankings();
  const list = all[String(targetSum)] || [];

  let html = `<div class="ranking-header" style="font-size: 13px; margin-bottom: 12px;">合計 ${targetSum} の上位記録</div>`;
  if (list.length === 0) {
    html += '<div class="ranking-empty" style="background: var(--bg-1); padding: 24px; border-radius: 4px;">まだ記録がありません</div>';
  } else {
    html += '<ol class="ranking-list" style="background: var(--bg-1); padding: 8px 14px; border-radius: 4px;">';
    list.forEach((entry, i) => {
      const rankClass = i === 0 ? 'first' : '';
      html += `<li>
        <span class="rank-num ${rankClass}">${i + 1}</span>
        <span class="rank-score">${entry.score.toLocaleString()}点</span>
        <span class="rank-meta">Lv${entry.level} ・ ${formatDate(entry.date)}</span>
      </li>`;
    });
    html += '</ol>';
  }
  content.innerHTML = html;
}

(function makeFloatingDigits() {
  const container = document.getElementById('floating-digits');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.textContent = Math.floor(Math.random() * 9) + 1;
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (40 + Math.random() * 80) + 'px';
    s.style.animationDelay = (-Math.random() * 30) + 's';
    s.style.animationDuration = (20 + Math.random() * 30) + 's';
    container.appendChild(s);
  }
})();

buildBoard();
fillGridFresh();
setTimeout(adjustFontSize, 100);
requestAnimationFrame(loop);
</script>
